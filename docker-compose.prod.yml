services:
  # ========== REVERSE PROXY NGINX ==========
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: anciens_examens_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - anciens_examens_network
    volumes:
      - ./cloudflare-certs:/etc/nginx/cloudflare-certs:ro  # ← Certificats Cloudflare

  # ========== BACKEND NODE.JS ==========
  backend:
    build:
      context: ./anciens_examens_back
      dockerfile: Dockerfile
    container_name: anciens_examens_backend_prod
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379  # Désactivé temporairement
    # depends_on:
    #   - redis  # Désactivé temporairement
    networks:
      - anciens_examens_network

  # ========== FRONTEND REACT + NGINX ==========
  frontend:
    build:
      context: ./anciens_examens_front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: anciens_examens_frontend_prod
    restart: always
    expose:
      - "80"
    networks:
      - anciens_examens_network

  # ========== REDIS (DÉSACTIVÉ TEMPORAIREMENT) ==========
  # redis:
  #   image: redis:7-alpine
  #   container_name: anciens_examens_redis_prod
  #   restart: always
  #   expose:
  #     - "6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - anciens_examens_network
  #   command: >
  #     sh -c "
  #     if [ -n \"${REDIS_PASSWORD}\" ]; then
  #       redis-server --appendonly yes --requirepass \"${REDIS_PASSWORD}\"
  #     else
  #       redis-server --appendonly yes
  #     fi
  #     "

# volumes:
#   redis_data:
#     driver: local

