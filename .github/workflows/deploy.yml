# ==========================================
# NOM DU WORKFLOW
# ==========================================
name: Deploy to Production

# ==========================================
# QUAND LE WORKFLOW SE DÉCLENCHE
# ==========================================
on:
  push:
    branches:
      - main  # Se déclenche quand on push sur la branche main
  pull_request:
    branches:
      - main  # Se déclenche aussi sur les PR vers main

# ==========================================
# JOBS (TÂCHES)
# ==========================================
jobs:
  # ----------------------------------------
  # JOB 1 : TESTS ET BUILD
  # ----------------------------------------
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest  # Runner GitHub gratuit

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            anciens_examens_back/package-lock.json
            anciens_examens_front/package-lock.json

      # Étape 3 : Installer les dépendances backend
      - name: Install backend dependencies
        working-directory: ./anciens_examens_back
        run: npm ci

      # Étape 4 : Installer les dépendances frontend
      - name: Install frontend dependencies
        working-directory: ./anciens_examens_front
        run: npm ci

      # Étape 5 : Créer le fichier .env pour le build frontend
      - name: Create frontend environment file
        working-directory: ./anciens_examens_front
        run: |
          cat > .env << EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOF

      # Étape 6 : Build du frontend
      - name: Build frontend
        working-directory: ./anciens_examens_front
        run: npm run build

      # Étape 7 : Créer le fichier .env pour les tests avec les secrets GitHub
      - name: Create test environment file
        working-directory: ./anciens_examens_back
        run: |
          cat > .env << EOF
          PORT=5000
          MONGODB_URI=mongodb://localhost:27017/test
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          JWT_EXPIRE=7d
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          FRONTEND_URL=http://localhost:3000
          NODE_ENV=test
          EOF

      # Étape 8 : Tests backend (si vous en avez)
      - name: Run backend tests
        working-directory: ./anciens_examens_back
        run: npm test --if-present

  # ----------------------------------------
  # JOB 2 : DÉPLOIEMENT
  # ----------------------------------------
  deploy:
    name: Deploy to VPS
    needs: test-and-build  # Attend que le job 1 réussisse
    runs-on: self-hosted   # Utilise VOTRE VPS comme runner

    steps:
      # Étape 1 : Récupérer le code sur le VPS
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # ÉTAPE CRUCIALE : COPIER LES CERTIFICATS SSL
      # ==========================================
      # Les certificats Cloudflare Origin sont stockés sur le VPS
      # dans /root/anciens_examens_MERN/cloudflare-certs/
      # Le runner GitHub clone le code dans un dossier temporaire
      # donc les certificats ne sont pas automatiquement présents.
      # On les copie dans le workspace du runner avant le build Docker.
      # ==========================================
      - name: Copy SSL certificates from VPS
        run: |
          echo "📁 Création du dossier cloudflare-certs..."
          mkdir -p cloudflare-certs

          echo "📋 Liste des certificats disponibles sur le VPS :"
          ls -la /home/bkr/anciens_examens_MERN/cloudflare-certs/ || echo "⚠️ Dossier source non trouvé"

          echo "📥 Copie des certificats..."
          cp /home/bkr/anciens_examens_MERN/cloudflare-certs/cert.pem cloudflare-certs/ || echo "❌ cert.pem non trouvé"
          cp /home/bkr/anciens_examens_MERN/cloudflare-certs/key.pem cloudflare-certs/ || echo "❌ key.pem non trouvé"

          echo "✅ Certificats copiés. Vérification :"
          ls -la cloudflare-certs/

          echo "🔒 Vérification du contenu :"
          head -n 1 cloudflare-certs/cert.pem || echo "cert.pem vide"
          head -n 1 cloudflare-certs/key.pem || echo "key.pem vide"

      # Étape 2 : Créer le fichier .env sur le VPS
      - name: Create .env file
        run: |
          cat > .env << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOF

      # Étape 3 : Arrêter les conteneurs existants
      - name: Stop existing containers
        run: docker compose -f docker-compose.prod.yml down

      # Étape 4 : Nettoyer les anciennes images
      - name: Clean old images
        run: docker system prune -af --volumes

      # Étape 5 : Build et démarrer les nouveaux conteneurs
      - name: Build and start containers
        run: docker compose -f docker-compose.prod.yml up --build -d

      # Étape 6 : Vérifier que tout est démarré
      - name: Verify deployment
        run: |
          echo "⏳ Attente du démarrage des services..."
          sleep 30

          echo "📊 État des conteneurs :"
          docker compose -f docker-compose.prod.yml ps

          echo "🔍 Vérification des logs si des conteneurs ne sont pas up :"
          docker compose -f docker-compose.prod.yml logs --tail=20 nginx || true

          echo "🌐 Test de connexion à nginx :"
          for i in {1..10}; do
            if curl -f http://localhost >/dev/null 2>&1; then
              echo "✅ Nginx est accessible !"
              break
            else
              echo "⏳ Tentative $i/10 - Nginx pas encore prêt..."
              sleep 5
            fi
          done

          # Vérification finale
          if ! curl -f http://localhost >/dev/null 2>&1; then
            echo "❌ Nginx n'est toujours pas accessible après 50 secondes"
            echo "📋 Logs complets de nginx :"
            docker compose -f docker-compose.prod.yml logs --tail=50 nginx || true
            echo ""
            echo "📋 Logs complets de tous les services :"
            docker compose -f docker-compose.prod.yml logs --tail=50 || true
            exit 1
          fi

      # Étape 7 : Migration des examens existants vers IA
      - name: Migrate existing exams to AI
        run: |
          echo "🚀 Lancement de la migration des examens vers IA..."
          docker compose -f docker-compose.prod.yml exec -T backend node scripts/migrate-exams-to-ai.js || echo "⚠️ Migration terminée avec des erreurs (certains examens peuvent avoir échoué)"

      # Étape 8 : Notification de succès (optionnel)
      - name: Deployment success
        if: success()
        run: echo "✅ Déploiement réussi sur https://anciensexamensuidt.app"
