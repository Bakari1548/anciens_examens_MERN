# ==========================================
# Docker Compose - Environnement de DÉVELOPPEMENT
# ==========================================
# Pour lancer : docker compose up
# Pour reconstruire : docker compose up --build
# Pour arrêter : docker compose down
# ==========================================
# Services exposés sur l'hôte :
#   - Frontend (Vite + HMR)  : http://localhost:3000
#   - Backend (Node + watch) : http://localhost:5000
#   - Redis (optionnel)      : redis://localhost:6379
#
# MongoDB : Atlas (URI dans anciens_examens_back/.env -> MONGODB_URI)
# ===========================================

services:
  # ==================== BACKEND Node.js (DEV avec hot reload) ====================
  backend:
    build:
      context: ./anciens_examens_back
      dockerfile: Dockerfile.dev
    container_name: anciens_examens_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      # MongoDB Atlas — vient du fichier .env (MONGODB_URI=mongodb+srv://...)
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    env_file:
      - ./anciens_examens_back/.env
    networks:
      - anciens_examens_network
    volumes:
      # Bind mount du code source pour hot reload
      - ./anciens_examens_back:/app
      # Volume anonyme pour conserver node_modules installé dans l'image
      - /app/node_modules

  # ==================== FRONTEND React + Vite (DEV avec HMR) ====================
  frontend:
    build:
      context: ./anciens_examens_front
      dockerfile: Dockerfile.dev
    container_name: anciens_examens_frontend_dev
    restart: unless-stopped
    environment:
      # En dev, le navigateur tourne sur l'hôte → utilise localhost:5000 (port exposé)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      CHOKIDAR_USEPOLLING: "true"  # Nécessaire sur WSL/macOS pour HMR
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - redis
    networks:
      - anciens_examens_network
    volumes:
      - ./anciens_examens_front:/app
      # Volume anonyme pour conserver node_modules installé dans l'image
      - /app/node_modules

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: anciens_examens_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - anciens_examens_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==================== Volumes ====================
volumes:
  redis_data:
    driver: local

# ==================== Réseaux ====================
networks:
  anciens_examens_network:
    driver: bridge
