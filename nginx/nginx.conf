# ==========================================
# HTTP : Redirection vers HTTPS
# ==========================================
server {
    listen 80;
    server_name anciensexamensuidt.app www.anciensexamensuidt.app;

    # Challenge Let's Encrypt (si besoin futur)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout redirige vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# HTTPS : Application sécurisée
# ==========================================
server {
    listen 443 ssl;
    server_name anciensexamensuidt.app www.anciensexamensuidt.app;

    client_max_body_size 50M;

    # Certificats Cloudflare Origin
    ssl_certificate /etc/nginx/cloudflare-certs/cert.pem;
    ssl_certificate_key /etc/nginx/cloudflare-certs/key.pem;

    # Paramètres SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Frontend React
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # CORS dynamique: accepter à la fois apex et www
        set $cors_origin "";
        if ($http_origin ~* ^https://(www\.)?anciensexamensuidt\.app$) {
            set $cors_origin $http_origin;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Accept,Content-Type,Origin,Authorization,Cookie' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Gestion de la requête de pré-vérification (Preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Important pour les uploads de fichiers volumineux (mobile lents)
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 1m;
        client_max_body_size 50M;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
