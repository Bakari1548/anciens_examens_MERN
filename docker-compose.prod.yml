version: '3.8'

services:
  # ========== REVERSE PROXY NGINX ==========
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: anciens_examens_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"  # Pour HTTPS futur
    depends_on:
      - backend
      - frontend
    networks:
      - anciens_examens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== BACKEND NODE.JS ==========
  backend:
    build:
      context: ./anciens_examens_back
      dockerfile: Dockerfile
    container_name: anciens_examens_backend_prod
    restart: always
    expose:
      - "5000"  # Pas de ports publiés, uniquement accessible via le réseau Docker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - anciens_examens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== FRONTEND REACT (NGINX) ==========
  frontend:
    build:
      context: ./anciens_examens_front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: anciens_examens_frontend_prod
    restart: always
    expose:
      - "80"  # Pas de ports publiés, uniquement via le réseau Docker
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - anciens_examens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== REDIS ==========
  redis:
    image: redis:7-alpine
    container_name: anciens_examens_redis_prod
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - anciens_examens_network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local

networks:
  anciens_examens_network:
    driver: bridge